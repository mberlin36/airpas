<div class="submission-table-container table-container">
  <div class="table-scroll-region">
    <table mat-table matSort (matSortChange)="sortChange($event)" [dataSource]="dataSource()">
      <!-- Position Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let index = index">
          {{ pageIndex() * pageSize() + index + 1 }}
        </td>
      </ng-container>

      <!-- Vendor Column -->
      <ng-container matColumnDef="vendorName">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Vendor</th>
        <td mat-cell *matCellDef="let element">{{ element.vendorName }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <!-- Line Count Column -->
      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef>Items</th>
        <td mat-cell *matCellDef="let element">{{ element.lineCount }}</td>
      </ng-container>

      <!-- Total Value Column -->
      <ng-container matColumnDef="totalValue">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let element">{{ element.totalValue | currency }}</td>
      </ng-container>

      <!-- Submitted Date Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Submitted</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'short' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row (click)="rowClick(row)" *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="length()"
    [pageSizeOptions]="pageSizes()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    (page)="pageChange($event)"
    showFirstLastButtons="true"
  ></mat-paginator>
</div>
