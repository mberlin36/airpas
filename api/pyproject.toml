[project]
name = "airpas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
]

[project.scripts]
api = "airpas:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
